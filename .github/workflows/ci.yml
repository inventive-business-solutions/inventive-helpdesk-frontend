name: INVENTIVE HELPDESK FRONTEND CI/CD PIPELINE

on:
  push:
    # development builds and tests but never pushes or deploys, so a failure shows up
    # while you are still working rather than at merge time. Only master releases.
    # Matches the backend pipeline; without development here the first build this code
    # ever got was the release itself.
    branches: [master, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Quality, Build & Deploy — Production
  #
  # Deliberately one job. The runner is single-executor, so splitting quality
  # checks into their own job buys no parallelism and costs a second checkout
  # plus `npm ci`; it also opens a window for another run to take the runner
  # between the gate and the build it was meant to gate.
  # ============================================================
  BUILD_AND_DEPLOY_PROD:
    name: Quality, Build & Deploy
    # The Microscan host, by name — after two attempts at being cleverer than that.
    #
    # It was first pinned to inventive-microscan-2, so a frontend release would not queue
    # behind a backend image build. Then -2 went offline and the frontend could not build
    # AT ALL for over an hour: a named label has no fallback, so one dead agent is a total
    # outage for whichever repo named it.
    #
    # Dropping the name was worse. A bare [self-hosted] matches EVERY self-hosted runner in
    # the org, including a Windows one that took the job and died on the first bash line
    # ("Expressions are only allowed as the first element of a pipeline", from
    # C:\Users\...\actions-runner). Adding Linux/X64 fixed that and exposed the real
    # problem: the org has OTHER Linux agents. Runs landed on qua-prod-x64 and quadev,
    # which belong to a different project.
    #
    # Those agents build and push the image fine, and can POST the deploy webhook — but
    # they have no network path to helpdesk.inventivebizsol.co.in. So "Verify deployment"
    # polled twelve times, got `unavailable` every time, and failed a release that had
    # deployed correctly and was serving traffic throughout. A red release that is really
    # green is worse than no check at all, because the next genuine failure looks the same.
    # The Microscan agents can always reach production: they are on the same host as it.
    #
    # Now back on -2, with the backend on inventive-microscan, so the two repos build in
    # parallel instead of taking turns. Sharing one agent cost about six minutes per
    # release, and on 2026-07-27 a development run took the agent ahead of a queued
    # PRODUCTION release, which is the wrong thing to be waiting on.
    #
    # This is knowingly the configuration that failed earlier that same day: a named label
    # has no fallback, so if -2 is offline this queues forever rather than moving to the
    # other agent. Accepted because the recovery is known and takes a minute:
    #
    #     ssh ubuntu@<host>
    #     sudo systemctl restart 'actions.runner.*microscan-2*'
    #
    # This is a STOPGAP. The correct fix is one shared custom label — say `helpdesk` — on
    # both Microscan agents, then `runs-on: [self-hosted, Linux, X64, helpdesk]`, which
    # gives parallelism AND fallback and still excludes the foreign agents. `runs-on`
    # labels are ANDed, so no array can express "microscan OR microscan-2" — the label has
    # to exist on both. Creating it needs org-runner permission, which this repo's admins
    # do not have; it is an org-owner action. Do that and delete this paragraph.
    #
    # Linux/X64 are kept as a guard, so this cannot be satisfied by a Windows box if the
    # inventive-microscan-2 label is ever applied to one.
    #
    # The DOCKER_CONFIG isolation below now matters MORE, not less: both repos share
    # /home/ubuntu/.docker/config.json on this host, and docker/login-action's post step
    # runs `docker logout ghcr.io` against it.
    runs-on: [self-hosted, Linux, X64, inventive-microscan-2]
    environment: Production
    timeout-minutes: 45

    env:
      # Matches the Dockerfile base image, so a type or lint error cannot pass here
      # and then fail inside the image build on a different Node.
      NODE_VERSION: "24.18.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Fail fast with a readable message. Without this an unset IMAGE_NAME surfaces
      # several steps later as `invalid tag ":<sha>": invalid reference format`, and an
      # unset FRAPPE_URL produces a perfectly green pipeline shipping an image whose
      # proxy targets point at localhost.
      - name: Validate required configuration
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
          FRAPPE_URL: ${{ vars.FRAPPE_URL }}
          SOCKETIO_URL: ${{ vars.SOCKETIO_URL }}
        run: |
          missing=""
          [ -z "$IMAGE_NAME" ]       && missing="$missing IMAGE_NAME(variable)"
          [ -z "$FRONTEND_DOMAIN" ]  && missing="$missing FRONTEND_DOMAIN(variable)"
          [ -z "$FRAPPE_URL" ]       && missing="$missing FRAPPE_URL(variable)"
          [ -z "$SOCKETIO_URL" ]     && missing="$missing SOCKETIO_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required config on the Production environment:$missing"
            exit 1
          fi
          case "$FRAPPE_URL" in
            https://*) ;;
            *) echo "::error::FRAPPE_URL must be https in production. Got: $FRAPPE_URL"; exit 1 ;;
          esac
          echo "Configuration present."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: 'npm'`. Measured on this runner class, restoring the Actions npm
          # cache is far slower than a cold `npm ci`. Re-measure before re-adding.

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      # Prettier is configured and the tree is clean; without a gate it silently drifts
      # and every later diff carries unrelated reformatting.
      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # inventive-microscan and inventive-microscan-2 are two runner agents on the SAME
      # host under the same `ubuntu` user, so by default they share
      # /home/ubuntu/.docker/config.json. docker/login-action's post step runs
      # `docker logout ghcr.io`, which empties `auths` in that shared file — so a build
      # finishing in another repo can strip this job's credentials mid-run. GHCR reports
      # the result as "manifest unknown" rather than 401, so it reads as a missing image
      # instead of an auth failure and sends you looking in the wrong place.
      #
      # Giving this job its own DOCKER_CONFIG makes both the login and the logout private
      # to this run. That also stops this job writing to the shared file at all, so the
      # backend pipeline on inventive-microscan is no more exposed than it was when both
      # repos shared one runner.
      #
      # Must precede setup-buildx-action: the builder resolves the config path at creation.
      - name: Isolate Docker credentials to this job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AMD64 image (published only from master)
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build on BOTH branches, publish only from master. The build is the point on
          # development: `next build` is the only thing that runs the prerender pass, so
          # a missing Suspense boundary around useSearchParams, a bad route export or a
          # server/client boundary mistake surfaces here and nowhere else — lint,
          # typecheck and vitest all pass straight through them.
          #
          # `load`, not `push`: the image goes to the runner's local daemon so the smoke
          # step below can RUN it, and the registry push happens afterwards only if that
          # passes. Publishing straight from here put an unexercised image in the registry
          # and then deployed it — which is how a route that 404s reached production with
          # every check green. Same order the backend pipeline already uses.
          load: true
          tags: |
            ${{ vars.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.IMAGE_NAME }}:latest
          # Must match the Swarm node's architecture (linux/x86_64). A mismatch shows up
          # as "no suitable node (unsupported platform)" with tasks stuck pending.
          platforms: linux/amd64
          # Keeps the manifest single-platform; provenance attestations add an
          # "unknown/unknown" entry that confuses some registry/pull paths.
          provenance: false
          # No registry cache here, and that is a measured decision rather than an
          # oversight. Tried on 2026-07-27, all three runs on inventive-microscan-2:
          #
          #     no cache      54s
          #     cache write  151s
          #     cache read    72s
          #
          # It is ~18s SLOWER than no cache at all. This runner is persistent, so its local
          # Docker layer cache is already warm and reusing `npm ci` from disk; adding a
          # registry cache means pulling those layers back over the network, which costs
          # more than it saves on a build this size.
          #
          # The backend genuinely benefits (260s -> 99s) because it ran with
          # `no-cache: true` and so reused nothing at all — the registry cache replaces a
          # from-scratch rebuild there, not a warm local one. Do not copy that setting here
          # by symmetry; measure again first, and only if this build gets much bigger.
          build-args: |
            FRAPPE_URL=${{ vars.FRAPPE_URL }}
            SOCKETIO_URL=${{ vars.SOCKETIO_URL }}
            BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      # ============================================================
      # Smoke the ARTIFACT, not the source.
      #
      # Everything above this line tests source: eslint, tsc and vitest never make an HTTP
      # request, and `next build` proves the bundle compiles, not that the running server
      # answers. Two production bugs in one day lived exactly in that gap — both were
      # correct code behind an unreachable route:
      #
      #   * `delete_product` shipped without its next.config.mjs rewrite. Next answered
      #     with its own 404 before Frappe saw the call; the UI said "Something went wrong".
      #   * `app/icon.svg` is an App Router route, so proxy.ts auth-gated it and returned
      #     307 -> /login for every signed-out visitor — i.e. everyone on the sign-in page.
      #
      # A running container answers both questions in seconds. This runs on every branch,
      # so development catches them too, and the push below is gated on it.
      # ============================================================
      - name: Smoke the built image
        env:
          IMAGE_REF: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          # Repo-scoped, not just run-scoped. This host runs pipelines for other repos in
          # the org, so the name has to be unambiguously ours — both to avoid a collision
          # and so the cleanup sweep below can never match somebody else's container.
          NAME: smoke-hd-frontend-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Port 0 lets Docker pick a free one — two runs on the same agent must not
          # collide, and both agents are on one host.
          #
          # FRAPPE_URL points at a closed port on purpose. The health route calls the
          # backend with a 5s timeout and reports `degraded` rather than failing, so a
          # refused connection keeps the readiness loop fast without changing any verdict
          # below. The PROXY destinations are baked at build time and unaffected by this.
          docker run -d --name "$NAME" -p 127.0.0.1::3000 \
            -e FRAPPE_URL=http://127.0.0.1:1 "$IMAGE_REF" >/dev/null
          trap 'docker logs "$NAME" 2>&1 | tail -40 || true; docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          BASE="http://$(docker port "$NAME" 3000/tcp | head -1)"
          echo "smoking $BASE"

          for i in $(seq 1 60); do
            curl -fsS --max-time 3 "$BASE/api/health" >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "::error::container never became ready"; exit 1; }
            sleep 1
          done

          # 1. The image is the commit CI thinks it is. Guards against a cache serving an
          #    older build under a new tag — the exact failure that made the backend
          #    disable its layer cache.
          got=$(curl -fsS "$BASE/api/health" | jq -r .version)
          [ "$got" = "$GITHUB_SHA" ] || { echo "::error::image reports $got, expected $GITHUB_SHA"; exit 1; }

          # 2. Metadata routes are reachable without a session. `grep -q "<svg"` because a
          #    307 to /login also returns a body — a status check alone passed this bug.
          curl -fsS "$BASE/icon.svg" | grep -q "<svg" \
            || { echo "::error::/icon.svg is not served (auth-gated? missing?)"; exit 1; }

          # 3. The auth gate still gates. The inverse of 2, so a fix to one cannot quietly
          #    disable the other.
          code=$(curl -so /dev/null -w '%{http_code}' "$BASE/tickets")
          [ "$code" = "307" ] || { echo "::error::/tickets returned $code, expected 307"; exit 1; }

          # 4. Every one of OUR whitelisted endpoints is routed. 404 means next.config.mjs
          #    has no rewrite for it and the call dies at the proxy; anything else means it
          #    reached Frappe, which is all this asserts.
          #
          #    Scoped to inventive_helpdesk_backend.* deliberately: these all refuse an
          #    unauthenticated caller at the top of the function, so probing them is inert.
          #    Frappe core methods in the same allowlist are covered by
          #    tests/proxy-allowlist.test.ts, which compares the files statically and needs
          #    no request at all.
          fail=0
          for m in $(grep -oP '(?<=/api/frappe/method/)inventive_helpdesk_backend\.[^"]+' next.config.mjs | sort -u); do
            code=$(curl -so /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                     -d '{}' --max-time 20 "$BASE/api/frappe/method/$m" || echo 000)
            if [ "$code" = "404" ]; then echo "::error::$m is not routed by next.config.mjs"; fail=1; fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "Smoke passed."

      # Only now does the image become something the world can pull. Mirrors the backend
      # pipeline: build local -> exercise it -> publish. Nothing untested reaches the
      # registry, so a failed smoke cannot be deployed by a later stack redeploy either.
      - name: Push image to registry
        if: success() && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          docker push "${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ vars.IMAGE_NAME }}:latest"
          echo "Pushed :${{ github.sha }} and :latest"

      # The stack's VERSION must be "latest" (not a pinned SHA). This webhook only
      # redeploys the stack — it does not set environment variables, and a ?VERSION=
      # query parameter is silently ignored on Portainer Community Edition. Because
      # `docker stack deploy` re-resolves a tag to its current registry digest,
      # redeploying :latest picks up the image this run just pushed.
      # Deploy the exact image this run built, by DIGEST, straight to Swarm.
      #
      # Replaces a Portainer webhook that redeployed the stack so `:latest` would be
      # re-resolved. That worked, but it could not answer "what is running right now" with
      # anything better than a moving tag, and rolling back meant rebuilding an older
      # commit and racing it into the same mutable tag. A digest is immutable, so the
      # answer is exact and the previous one stays addressable.
      #
      # The runner is ON this Swarm node, so it drives the daemon directly — no webhook,
      # no credentials for Portainer's API, nothing to time out.
      #
      # ONLY the frontend deploys this way. The backend stack is nine services sharing one
      # image (backend, frontend, websocket, scheduler, three queues, plus cron-driven
      # migration and clear-cache). Updating those individually risks a partial failure
      # leaving workers on old code against a freshly migrated schema, so it keeps its
      # whole-stack redeploy, which moves them together. This service is one stateless
      # container, which is what makes the atomic swap below safe.
      #
      # Branch-gated, not just success-gated: development must never reach the server.
      - name: Deploy by digest
        id: deploy
        if: success() && github.ref == 'refs/heads/master'
        env:
          SERVICE: inventive-helpdesk-frontend_frontend
          IMAGE_REF: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -euo pipefail

          # The digest is only populated after the push above, and both tags resolve to the
          # same one. Matched on the repo name rather than taking element 0, so an unrelated
          # entry could never be selected silently.
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_REF" \
                   | grep "^${{ vars.IMAGE_NAME }}@" | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::No repo digest for $IMAGE_REF — was the push step skipped?"
            exit 1
          fi

          PREV=$(docker service inspect --format='{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$SERVICE")
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST"  >> "$GITHUB_OUTPUT"
          echo "Rolling $SERVICE"
          echo "  from: $PREV"
          echo "  to:   $DIGEST"

          # start-first: the running task keeps serving until the new one is up, so a
          # release is not a gap in availability.
          #
          # --with-registry-auth hands this job's registry credentials to Swarm so it can
          # pull. Note the token is scoped to this run: the image is already present on
          # this node (it was built here), so the update itself never needs a pull, but a
          # task restarted weeks later on a pruned node could. If that ever bites, the fix
          # is a long-lived pull credential on the node, not a change here.
          #
          # --detach=false blocks until the update converges or fails, which is what makes
          # the rollback step below meaningful.
          docker service update \
            --image "$DIGEST" \
            --update-order start-first \
            --with-registry-auth \
            --detach=false \
            "$SERVICE"

      # Compares the running container's baked BUILD_SHA against this commit. A plain
      # HTTP 200 check would pass against the previous container still serving traffic.
      - name: Verify deployment
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          HEALTH_URL="https://${{ vars.FRONTEND_DOMAIN }}/api/health"
          # Poll from the first second rather than sleeping first. The old `sleep 45` was
          # a guess at how long a restart takes, and it was consistently too long —
          # measured on 2026-07-27 the container was already serving the new SHA 37s after
          # the webhook, so every release paid ~45s of dead time and then still waited up
          # to another 15s for the first probe. A stale reply costs nothing: the loop
          # compares build SHAs, so the previous container answering is just a retry.
          #
          # Same worst-case budget as before (45 x 5s = 225s), spent on probing instead of
          # waiting, so the typical release finishes verification in seconds.
          MAX_ATTEMPTS=45
          WAIT_SECONDS=5
          echo "Polling for the new build..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RESPONSE=$(curl -s --max-time 10 "$HEALTH_URL" || true)
            DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.version // empty' 2>/dev/null || true)

            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ]; then
              echo "Deployment verified — running build $DEPLOYED_SHA"
              # Surface a backend that is unreachable from inside the container. Not fatal:
              # the frontend is genuinely deployed, and failing here would blame the wrong
              # stack for a backend outage.
              STATUS=$(echo "$RESPONSE" | jq -r '.status // empty' 2>/dev/null || true)
              if [ "$STATUS" != "ok" ]; then
                echo "::warning::Frontend is live but reports status=${STATUS}. Detail: $(echo "$RESPONSE" | jq -c '.checks' 2>/dev/null || echo "$RESPONSE")"
              fi
              echo "status=healthy" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS — deployed: ${DEPLOYED_SHA:-unavailable}, expected: $EXPECTED_SHA. Retrying in ${WAIT_SECONDS}s..."
            sleep $WAIT_SECONDS
          done

          echo "::error::Verification failed — $EXPECTED_SHA not live after $MAX_ATTEMPTS attempts"
          echo "status=unhealthy" >> "$GITHUB_OUTPUT"
          exit 1

      # The point of deploying by digest. Previously a bad release could only be undone by
      # rebuilding an older commit and racing it into `:latest`; Swarm keeps the previous
      # task spec, so reverting is one command and lands in seconds.
      #
      # Gated on the deploy having SUCCEEDED: if the update itself failed, Swarm already
      # left the old task running and there is nothing to revert — rolling back then would
      # move the service to whatever preceded the version currently serving traffic, which
      # is a second unintended change on top of a failure.
      #
      # Runs when verification fails, and also on cancellation: a release abandoned midway
      # would otherwise leave the new image live but unverified.
      - name: Roll back on failed verification
        id: rollback
        if: always() && steps.deploy.outcome == 'success' && steps.verify.outcome != 'success'
        env:
          SERVICE: inventive-helpdesk-frontend_frontend
        run: |
          set -euo pipefail
          echo "::warning::Verification did not pass — reverting $SERVICE to its previous task spec"
          docker service rollback --detach=false "$SERVICE"
          NOW=$(docker service inspect --format='{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$SERVICE")
          echo "Rolled back. Service is now on: $NOW"
          echo "::notice::Rolled back to $NOW. The failed build is still in the registry as ${{ github.sha }} for inspection."

      # This agent is shared with other repos in the org, so the job cleans up after
      # itself rather than leaving that to whoever runs next.
      #
      # `if: always()` and not the smoke step's own `trap`: the trap covers a normal exit
      # or a failed assertion, but a CANCELLED job is killed without running it — and a
      # leaked container would sit there holding memory and a published port on a machine
      # that is also serving production. GitHub still runs always() steps on cancellation.
      #
      # The image tags matter more than they look: `load: true` puts a multi-hundred-MB
      # image into the shared daemon on EVERY run, including development. Left alone that
      # fills the host's disk, which would break every other pipeline on it long before it
      # broke this one. The backend pipeline has done this since it started loading images.
      #
      # The sweep is filtered on our own prefix, so it can only ever match containers this
      # workflow created — never another repo's.
      - name: Clean up this job's containers and images
        if: always()
        run: |
          docker rm -f "smoke-hd-frontend-${{ github.run_id }}-${{ github.run_attempt }}" >/dev/null 2>&1 || true
          # Anything left by a previously cancelled run of THIS workflow.
          stale=$(docker ps -aq --filter "name=^smoke-hd-frontend-" 2>/dev/null || true)
          [ -n "$stale" ] && docker rm -f $stale >/dev/null 2>&1 || true
          docker rmi -f "${{ vars.IMAGE_NAME }}:${{ github.sha }}" >/dev/null 2>&1 || true
          docker rmi -f "${{ vars.IMAGE_NAME }}:latest" >/dev/null 2>&1 || true
          echo "Runner cleaned: smoke container and local image tags removed."

      - name: Deployment summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "| **Environment** | Production (release) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Environment** | Validation only — not published, not deployed |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| **Image** | \`${{ vars.IMAGE_NAME }}:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platform** | \`linux/amd64\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Frontend** | https://${{ vars.FRONTEND_DOMAIN }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Backend (baked)** | ${{ vars.FRAPPE_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deploy.outcome }}" == "success" ]; then
            echo "| **Deployed digest** | \`${{ steps.deploy.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Previous image** | \`${{ steps.deploy.outputs.previous }}\` |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.deploy.outcome }}" == "skipped" ]; then
            echo "| **Deploy** | Skipped — not master |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Deploy** | Failed |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.rollback.outcome }}" == "success" ]; then
            echo "| **Rollback** | Ran — service reverted to the previous task spec |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.verify.outcome }}" == "success" ]; then
            echo "| **Health Check** | Healthy |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.verify.outcome }}" == "skipped" ]; then
            echo "| **Health Check** | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Health Check** | Unhealthy |" >> "$GITHUB_STEP_SUMMARY"
          fi
